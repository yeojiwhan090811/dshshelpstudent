<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSHS AI Master v10.1</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    
    <style>
        :root { 
            --primary: #0056b3; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
            --primary-light: #e6f0ff; --danger: #ef4444;
        }

        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: var(--text); overflow-x: hidden; }
        
        nav { background: var(--primary); display: flex; overflow-x: auto; position: sticky; top: 0; z-index: 1000; padding: 5px; }
        .nav-btn { background: none; border: none; color: white; padding: 12px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; opacity: 0.6; }
        .nav-btn.active { opacity: 1; background: rgba(255,255,255,0.15); border-radius: 8px; }

        .container { max-width: 800px; margin: 15px auto; padding: 0 12px 100px; }
        .content-section { display: none; animation: fadeIn 0.3s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 0.95rem; box-sizing: border-box; margin-bottom: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }

        .tt-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th, td { border: 1px solid #f1f5f9; padding: 8px; text-align: center; font-size: 0.85rem; }
        .tt-s { width: 95%; height: 35px; border: none; background: #f1f5f9; border-radius: 6px; text-align: center; font-weight: 600; }

        .box { background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 10px; }
        .item-list { background: white; padding: 12px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 8px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<nav>
    <button class="nav-btn active" onclick="showTab('home', this)">🏠 홈</button>
    <button class="nav-btn" onclick="showTab('calendar-sec', this)">📅 학업 달력</button>
    <button class="nav-btn" onclick="showTab('team', this)">👥 팀 프로젝트</button>
    <button class="nav-btn" onclick="showTab('grade', this)">📈 성적 관리</button>
</nav>

<div class="container">
    <section id="home" class="content-section active">
        <div class="card">
            <h3>📅 주간 시간표</h3>
            <div class="tt-wrapper"><table id="mainTT"></table></div>
        </div>
        <div class="card">
            <h3>🔔 To-Do & D-Day</h3>
            <div style="display:flex; gap:8px;"><input type="text" id="todoIn" placeholder="과제 또는 수행평가..." style="margin:0;"><button class="btn" style="width:70px;" onclick="addTodo()">추가</button></div>
            <div id="todoList" class="box"></div>
            <div id="quickDday" class="box" style="font-weight:bold; color:var(--primary); font-size:0.85rem;"></div>
        </div>
    </section>

    <section id="calendar-sec" class="content-section">
        <div class="card">
            <h3>📅 일정 추가</h3>
            <input type="text" id="eventTitle" placeholder="일정 제목">
            <input type="date" id="eventDate">
            <button class="btn" onclick="addEvent()">달력에 반영</button>
        </div>
        <div class="card"><div id="calendar"></div></div>
    </section>

    <section id="team" class="content-section">
        <div id="lobby">
            <div class="card">
                <h3>👥 프로젝트 룸 접속</h3>
                <input type="text" id="tName" placeholder="방 이름"><input type="password" id="tPw" placeholder="비밀번호">
                <button class="btn" onclick="handleTeam()">접속 / 생성</button>
            </div>
        </div>
        <div id="room" style="display:none;">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;"><h3 id="roomTitle" style="margin:0;"></h3><button class="btn" style="width:70px; background:#64748b; padding:8px;" onclick="location.reload()">나가기</button></div>
                <div class="box" id="chatBox" style="height:200px; overflow-y:auto; margin-top:15px;"></div>
                <div style="display:flex; gap:5px; margin-top:10px;"><input type="text" id="chatIn" placeholder="메시지..." style="margin:0;"><button class="btn" style="width:60px;" onclick="sendChat()">전송</button></div>
            </div>
            <div class="card"><h3>📂 공동 작업 로그</h3><textarea id="teamLog" style="height:200px;" onkeyup="syncLog()"></textarea></div>
        </div>
    </section>

    <section id="grade" class="content-section">
        <div class="card">
            <h3>📈 성적 기록</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <select id="gType"><option value="내신">내신</option><option value="모의">모의고사</option></select>
                <input type="text" id="subN" placeholder="과목명">
            </div>
            <input type="text" id="subS" placeholder="등급 또는 점수 (예: 1등급 / 95점)">
            <button class="btn" onclick="saveGrade()">기록 저장</button>
        </div>
        <div class="card">
            <h3>📊 성적 히스토리</h3>
            <div id="gradeArea"></div>
        </div>
    </section>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://dshs-app-5af42-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let calendar;

    function showTab(id, b) {
        document.querySelectorAll('.content-section').forEach(s=>s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); b.classList.add('active');
        if(id === 'calendar-sec') setTimeout(() => { calendar.render(); calendar.updateSize(); }, 50);
    }

    // --- 시간표 ---
    const subs = ["문학","대수","미적1","영1","물1","화1","생1","지1","로봇","AI","데이터","창공","진로","자율"];
    function initTT() {
        let h = `<tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>`;
        for(let i=1; i<=7; i++){
            h += `<tr><td>${i}</td>`;
            for(let j=0; j<5; j++) h += `<td><select class="tt-s" data-rc="${i}-${j}" onchange="saveTT()"><option value="">-</option>${subs.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></td>`;
            h += `</tr>`;
        }
        document.getElementById('mainTT').innerHTML = h;
        const d = JSON.parse(localStorage.getItem('tt_v101')||'{}');
        document.querySelectorAll('.tt-s').forEach(s => { if(d[s.dataset.rc]) s.value = d[s.dataset.rc]; });
    }
    function saveTT() { const d = {}; document.querySelectorAll('.tt-s').forEach(s => d[s.dataset.rc] = s.value); localStorage.setItem('tt_v101', JSON.stringify(d)); }

    // --- 할 일 ---
    function addTodo() { const v = document.getElementById('todoIn').value; if(!v) return; const l = JSON.parse(localStorage.getItem('todo_v101')||'[]'); l.push(v); localStorage.setItem('todo_v101', JSON.stringify(l)); document.getElementById('todoIn').value=''; renderTodo(); }
    function renderTodo() { document.getElementById('todoList').innerHTML = JSON.parse(localStorage.getItem('todo_v101')||'[]').map((t,i)=>`<div class="item-list"><span>✅ ${t}</span><button onclick="delTodo(${i})" style="border:none; background:none; color:var(--danger); cursor:pointer;">삭제</button></div>`).join('') || "할 일이 없습니다."; }
    function delTodo(i) { const l = JSON.parse(localStorage.getItem('todo_v101')||'[]'); l.splice(i,1); localStorage.setItem('todo_v101', JSON.stringify(l)); renderTodo(); }

    // --- 성적 관리 (복구 핵심) ---
    function saveGrade() {
        const type = document.getElementById('gType').value;
        const name = document.getElementById('subN').value;
        const score = document.getElementById('subS').value;
        if(!name || !score) return alert("과목명과 성적을 입력하세요!");

        const gs = JSON.parse(localStorage.getItem('g_v101') || '[]');
        gs.unshift({ type, name, score, date: new Date().toLocaleDateString() });
        localStorage.setItem('g_v101', JSON.stringify(gs));
        
        document.getElementById('subN').value = '';
        document.getElementById('subS').value = '';
        renderGrades();
    }
    function renderGrades() {
        const gs = JSON.parse(localStorage.getItem('g_v101') || '[]');
        document.getElementById('gradeArea').innerHTML = gs.map((g, i) => `
            <div class="item-list">
                <span><b>[${g.type}]</b> ${g.name}: <span style="color:var(--primary); font-weight:bold;">${g.score}</span></span>
                <button onclick="delGrade(${i})" style="border:none; background:none; color:var(--danger); font-size:0.8rem;">삭제</button>
            </div>
        `).join('') || "기록된 성적이 없습니다.";
    }
    function delGrade(i) {
        const gs = JSON.parse(localStorage.getItem('g_v101') || '[]');
        gs.splice(i, 1);
        localStorage.setItem('g_v101', JSON.stringify(gs));
        renderGrades();
    }

    // --- 달력 및 D-Day ---
    function addEvent() {
        const t = document.getElementById('eventTitle').value, d = document.getElementById('eventDate').value;
        if(!t || !d) return;
        const evs = JSON.parse(localStorage.getItem('ev_v101')||'[]');
        const newEv = {title:t, start:d, allDay:true, color: '#0056b3'};
        evs.push(newEv);
        localStorage.setItem('ev_v101', JSON.stringify(evs));
        calendar.addEvent(newEv); renderDday();
    }
    function renderDday() {
        const evs = JSON.parse(localStorage.getItem('ev_v101')||'[]');
        const now = new Date();
        const upcoming = evs.filter(e => new Date(e.start) >= now).sort((a,b)=>new Date(a.start)-new Date(b.start));
        if(upcoming.length > 0) {
            const e = upcoming[0];
            const diff = Math.ceil((new Date(e.start)-now)/(1000*60*60*24));
            document.getElementById('quickDday').innerHTML = `📌 가장 가까운 일정: ${e.title} (D-${diff===0?'Day':diff})`;
        } else { document.getElementById('quickDday').innerHTML = "다가오는 일정이 없습니다."; }
    }

    // --- 팀플 ---
    let curT = "";
    function handleTeam() {
        const n = document.getElementById('tName').value, p = document.getElementById('tPw').value;
        if(!n||!p) return;
        db.ref('teamList/'+n).once('value', s => {
            if(!s.exists()) db.ref('teamList/'+n).set({pw:p});
            else if(s.val().pw !== p) return alert("비밀번호가 틀립니다.");
            curT = n; document.getElementById('lobby').style.display='none'; document.getElementById('room').style.display='block';
            document.getElementById('roomTitle').innerText = `🏠 ${n}`;
            db.ref('teams/'+n+'/chat').on('value', ss => {
                let h = ""; ss.forEach(c => h += `<div style="background:white; padding:8px; border-radius:8px; margin-bottom:5px; font-size:0.85rem;">${c.val().m}</div>`);
                const cb = document.getElementById('chatBox'); cb.innerHTML = h; cb.scrollTop = cb.scrollHeight;
            });
            db.ref('teams/'+n+'/log').on('value', ss => document.getElementById('teamLog').value = ss.val() || "");
        });
    }
    function sendChat() { const m = document.getElementById('chatIn').value; if(!m) return; db.ref('teams/'+curT+'/chat').push({m}); document.getElementById('chatIn').value=''; }
    function syncLog() { db.ref('teams/'+curT+'/log').set(document.getElementById('teamLog').value); }

    document.addEventListener('DOMContentLoaded', () => {
        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), { locale: 'ko', events: JSON.parse(localStorage.getItem('ev_v101')||'[]') });
        calendar.render(); initTT(); renderTodo(); renderDday(); renderGrades();
    });
</script>
</body>
</html>
