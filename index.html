<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSHS AI Master v13.4</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { 
            --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --secondary: #94a3b8; --danger: #f43f5e; --accent: #f59e0b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); margin: 0; color: var(--text); -webkit-font-smoothing: antialiased; }
        
        /* 상단 네비게이션 커스텀 */
        nav { background: var(--primary); display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 1000; padding: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .nav-btn { background: none; border: none; color: white; padding: 10px 14px; cursor: pointer; font-size: 0.9rem; font-weight: 600; border-radius: 12px; transition: 0.3s; opacity: 0.7; }
        .nav-btn.active { opacity: 1; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); }

        .container { max-width: 800px; margin: 20px auto; padding: 0 16px 100px; }
        .content-section { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .content-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 카드 디자인 강화 */
        .card { background: var(--card); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; border: 1px solid rgba(226, 232, 240, 0.8); }
        h3 { margin: 0 0 20px 0; font-size: 1.15rem; color: var(--text); font-weight: 800; display: flex; align-items: center; gap: 10px; }

        input, select, textarea { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 14px; font-size: 0.95rem; background: #fdfdfd; transition: 0.2s; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 16px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-sub { background: #f1f5f9; color: #475569; padding: 8px 12px; font-size: 0.8rem; border-radius: 10px; font-weight: 600; width: auto; margin-left: 5px; }

        .list-item { background: #f8fafc; padding: 16px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f5f9; }

        /* 시간표 및 달력 튀어나옴 방지 */
        .tt-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid #f1f5f9; background: #fff; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 0.75rem; padding: 10px; }
        td { border: 1px solid #f1f5f9; padding: 4px; }
        .tt-select { border: none; background: transparent; font-size: 0.85rem; padding: 8px; font-weight: 500; }

        /* FullCalendar 모바일 최적화 및 튀어나옴 방지 */
        #calendar { max-width: 100%; margin: 0 auto; font-size: 0.85rem; }
        .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 800; }
        .fc .fc-button { background: var(--primary); border: none; border-radius: 8px; }
        .fc .fc-view-harness { height: auto !important; } /* 높이 자동 조절 */
        .fc-daygrid-day-number { font-size: 0.8rem; padding: 4px !important; }

        .up-card { border-left: 6px solid var(--accent); }
        .up-ver { background: var(--accent); color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <button class="nav-btn active" onclick="showTab('home', this)">🏠 홈</button>
    <button class="nav-btn" onclick="showTab('schedule', this)">📅 일정</button>
    <button class="nav-btn" onclick="showTab('grade', this)">📈 성적분석</button>
    <button class="nav-btn" onclick="showTab('update', this)">📢 업데이트</button>
</nav>

<div class="container">
    <section id="home" class="content-section active">
        <div class="card">
            <h3>📅 주간 시간표</h3>
            <div class="tt-wrapper"><table id="mainTT"></table></div>
        </div>
        <div class="card">
            <h3>🔔 To-Do List</h3>
            <div style="display:flex; gap:8px; margin-bottom: 12px;">
                <input type="text" id="todoIn" placeholder="할 일을 입력하세요...">
                <button class="btn" style="width:70px; padding: 10px;" onclick="addTodo()">추가</button>
            </div>
            <div id="todoList"></div>
        </div>
    </section>

    <section id="schedule" class="content-section">
        <div class="card">
            <h3 id="evEditorTitle">📅 일정 추가 및 수정</h3>
            <input type="hidden" id="editEvId">
            <input type="text" id="evTitle" placeholder="일정 제목">
            <input type="date" id="evDate">
            <div style="display:flex; gap:8px;">
                <button class="btn" style="flex:1;" onclick="saveEvent()">저장하기</button>
                <button class="btn btn-sub" id="cancelEvBtn" style="display:none; padding: 16px;" onclick="resetEvForm()">취소</button>
            </div>
        </div>
        <div class="card" style="padding: 15px;"> <div id="calendar"></div>
        </div>
        <div class="card">
            <h3>📂 상세 일정 목록</h3>
            <div id="eventList"></div>
        </div>
    </section>

    <section id="grade" class="content-section">
        <div class="card">
            <h3>📊 성적 변화 추이</h3>
            <div style="display:flex; gap:8px; margin-bottom:15px;">
                <button class="btn btn-sub" style="flex:1;" onclick="updateChart('내신')">내신 등급</button>
                <button class="btn btn-sub" style="flex:1;" onclick="updateChart('모의')">모의고사 점수</button>
            </div>
            <div class="chart-container"><canvas id="gradeChart"></canvas></div>
        </div>
        <div class="card">
            <h3>📝 성적 기록</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 10px;">
                <select id="g_type" onchange="toggleGradeOptions()"><option value="내신">내신</option><option value="모의">모의고사</option></select>
                <select id="g_year"><option value="1학년">1학년</option><option value="2학년">2학년</option><option value="3학년">3학년</option></select>
            </div>
            <div id="opt_inner" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 10px;"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 10px;">
                <input type="text" id="g_sub" placeholder="과목명">
                <input type="number" id="g_val" placeholder="등급/점수" step="0.1">
            </div>
            <button class="btn" style="width:100%;" onclick="saveGrade()">데이터 추가</button>
        </div>
        <div class="card"><h3>📂 성적 이력</h3><div id="gradeHistory"></div></div>
    </section>

    <section id="update" class="content-section">
        <div id="adminPanel" class="card" style="display: none; border: 2px dashed var(--accent);">
            <h3>🛠️ 관리자 업데이트 도구</h3>
            <input type="text" id="up_ver" placeholder="버전 (v13.x)">
            <input type="text" id="up_title" placeholder="제목">
            <textarea id="up_desc" rows="4" placeholder="변경 사항을 입력하세요..."></textarea>
            <button class="btn" style="background: var(--accent); width: 100%;" onclick="pushUpdate()">업데이트 게시</button>
            <button class="btn-sub" style="margin-top:10px; width:100%;" onclick="hideAdmin()">모드 종료</button>
        </div>
        <div style="text-align: right; margin-bottom: 10px;">
            <span onclick="checkAdmin()" style="font-size: 0.6rem; color: #cbd5e1; cursor: pointer;">admin</span>
        </div>
        <div id="updateContainer"></div>
    </section>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://dshs-app-5af42-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let calendar, gradeChart;

    function showTab(id, b) {
        document.querySelectorAll('.content-section').forEach(s=>s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); b.classList.add('active');
        if(id === 'schedule') { 
            setTimeout(() => { calendar.render(); calendar.updateSize(); }, 50); 
            renderEventList(); 
        }
        if(id === 'grade') { renderGrades(); updateChart('내신'); }
        if(id === 'update') syncUpdates();
    }

    // 시간표 초기화
    function initTT() {
        const subs = ["문학", "대수", "미적분1", "영어1", "영어 발표와 토론", "한국지리 탐구", "세계사", "경제", "현대사회와 윤리", "물리학", "화학", "생명과학", "지구과학", "로봇과 공학세계", "인공지능 기초", "공학 설계", "데이터 과학"];
        let h = `<tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>`;
        for(let i=1; i<=7; i++) {
            h += `<tr><td style="background:#f8fafc; font-weight:bold;">${i}</td>` + Array(5).fill(0).map((_,j)=>`<td><select class="tt-select" data-id="${i}-${j}" onchange="saveTT()"><option value="">-</option>${subs.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></td>`).join('') + `</tr>`;
        }
        document.getElementById('mainTT').innerHTML = h;
        const saved = JSON.parse(localStorage.getItem('DSHS_TT') || '{}');
        document.querySelectorAll('.tt-select').forEach(s => { if(saved[s.dataset.id]) s.value = saved[s.dataset.id]; });
    }
    function saveTT() { const d = {}; document.querySelectorAll('.tt-select').forEach(s => d[s.dataset.id] = s.value); localStorage.setItem('DSHS_TT', JSON.stringify(d)); }

    // To-Do 리스트
    function renderTodo() {
        const list = JSON.parse(localStorage.getItem('DSHS_TODO') || '[]');
        const container = document.getElementById('todoList');
        container.innerHTML = list.map((item, idx) => `
            <div class="list-item">
                <span style="cursor:pointer; font-weight:500;" onclick="editTodo(${idx})">✅ ${item}</span>
                <button onclick="deleteTodo(${idx})" style="border:none; background:none; color:var(--danger); cursor:pointer;">✕</button>
            </div>
        `).join('') || "<p style='text-align:center; color:#94a3b8; font-size:0.85rem;'>할 일이 없습니다.</p>";
    }
    function addTodo() {
        const input = document.getElementById('todoIn');
        if(!input.value.trim()) return;
        const list = JSON.parse(localStorage.getItem('DSHS_TODO') || '[]');
        list.push(input.value.trim());
        localStorage.setItem('DSHS_TODO', JSON.stringify(list));
        input.value = ""; renderTodo();
    }
    function deleteTodo(idx) {
        const list = JSON.parse(localStorage.getItem('DSHS_TODO') || '[]');
        list.splice(idx, 1);
        localStorage.setItem('DSHS_TODO', JSON.stringify(list));
        renderTodo();
    }
    function editTodo(idx) {
        const list = JSON.parse(localStorage.getItem('DSHS_TODO') || '[]');
        const newVal = prompt("할 일 수정:", list[idx]);
        if(newVal) { list[idx] = newVal; localStorage.setItem('DSHS_TODO', JSON.stringify(list)); renderTodo(); }
    }

    // 일정 관리 및 달력 설정
    function saveEvent() {
        const title = document.getElementById('evTitle').value, date = document.getElementById('evDate').value, editId = document.getElementById('editEvId').value;
        if(!title || !date) return alert("제목과 날짜를 확인하세요.");
        let evs = JSON.parse(localStorage.getItem('DSHS_EVS') || '[]');
        if(editId) {
            const idx = evs.findIndex(e => e.id == editId);
            evs[idx] = { ...evs[idx], title, start: date };
        } else {
            evs.push({ id: Date.now(), title, start: date, allDay: true, backgroundColor: '#2563eb', borderColor: '#2563eb' });
        }
        localStorage.setItem('DSHS_EVS', JSON.stringify(evs));
        resetEvForm(); refreshCalendar(); renderEventList();
    }
    function renderEventList() {
        const evs = JSON.parse(localStorage.getItem('DSHS_EVS') || '[]');
        document.getElementById('eventList').innerHTML = evs.sort((a,b)=>new Date(a.start)-new Date(b.start)).map(e => `
            <div class="list-item">
                <span style="font-size:0.9rem;"><b>${e.start.split('-')[2]}일</b>: ${e.title}</span>
                <div>
                    <button class="btn-sub" onclick="editEv(${e.id})">수정</button>
                    <button class="btn-sub" style="color:var(--danger);" onclick="delEv(${e.id})">삭제</button>
                </div>
            </div>`).join('') || "일정이 없습니다.";
    }
    function editEv(id) {
        const e = JSON.parse(localStorage.getItem('DSHS_EVS')||'[]').find(i => i.id == id);
        document.getElementById('evTitle').value = e.title; document.getElementById('evDate').value = e.start;
        document.getElementById('editEvId').value = e.id; document.getElementById('evEditorTitle').innerText = "📝 일정 수정";
        document.getElementById('cancelEvBtn').style.display = "inline-block";
    }
    function delEv(id) { if(confirm("삭제할까요?")) { let evs = JSON.parse(localStorage.getItem('DSHS_EVS')||'[]'); evs = evs.filter(e=>e.id!=id); localStorage.setItem('DSHS_EVS', JSON.stringify(evs)); refreshCalendar(); renderEventList(); } }
    function resetEvForm() { document.getElementById('evTitle').value=""; document.getElementById('evDate').value=""; document.getElementById('editEvId').value=""; document.getElementById('evEditorTitle').innerText="📅 일정 추가 및 수정"; document.getElementById('cancelEvBtn').style.display="none"; }
    function refreshCalendar() { calendar.removeAllEvents(); calendar.addEventSource(JSON.parse(localStorage.getItem('DSHS_EVS')||'[]')); }

    // 성적 관리 로직 (생략 없이 유지)
    function toggleGradeOptions() {
        const type = document.getElementById('g_type').value;
        document.getElementById('opt_inner').innerHTML = (type === '내신') ? `<select id="g_term"><option value="1학기">1학기</option><option value="2학기">2학기</option></select><select id="g_exam"><option value="중간고사">중간고사</option><option value="기말고사">기말고사</option></select>` : `<select id="g_exam" style="grid-column: span 2;"><option value="3월">3월</option><option value="6월">6월</option><option value="9월">9월</option><option value="11월">11월</option></select>`;
    }
    function saveGrade() {
        const g = { id: Date.now(), type: document.getElementById('g_type').value, year: document.getElementById('g_year').value, term: document.getElementById('g_term')?.value || '', exam: document.getElementById('g_exam').value, sub: document.getElementById('g_sub').value, val: parseFloat(document.getElementById('g_val').value), date: new Date().getTime() };
        if(!g.sub || isNaN(g.val)) return alert("정보를 입력하세요.");
        let gs = JSON.parse(localStorage.getItem('DSHS_GRS') || '[]'); gs.push(g);
        localStorage.setItem('DSHS_GRS', JSON.stringify(gs)); renderGrades(); updateChart(g.type);
    }
    function renderGrades() {
        const gs = JSON.parse(localStorage.getItem('DSHS_GRS') || '[]');
        document.getElementById('gradeHistory').innerHTML = gs.sort((a,b)=>b.date-a.date).map(g => `<div class="list-item"><span><b>${g.year} ${g.exam}</b><br>${g.sub}</span><span style="color:var(--primary); font-weight:700;">${g.val}${g.type==='내신'?'등급':'점'}</span><button onclick="delGrade(${g.id})" style="border:none; color:var(--danger); background:none;">✕</button></div>`).join('') || "기록이 없습니다.";
    }
    function delGrade(id) { let gs = JSON.parse(localStorage.getItem('DSHS_GRS')||'[]'); gs = gs.filter(g=>g.id!=id); localStorage.setItem('DSHS_GRS', JSON.stringify(gs)); renderGrades(); }
    function updateChart(type) {
        const gs = JSON.parse(localStorage.getItem('DSHS_GRS') || '[]').filter(g => g.type === type).sort((a,b)=>a.date-b.date);
        if(gradeChart) gradeChart.destroy();
        gradeChart = new Chart(document.getElementById('gradeChart'), {
            type: 'line',
            data: { labels: gs.map(g=>`${g.year.charAt(0)}학년 ${g.exam}`), datasets: [{ label: type, data: gs.map(g=>g.val), borderColor: '#2563eb', tension: 0.3, fill: true, backgroundColor: 'rgba(37, 99, 235, 0.05)', pointRadius: 5 }] },
            options: { scales: { y: { reverse: (type==='내신') } } }
        });
    }

    // 관리자 및 업데이트
    function checkAdmin() { if (prompt("PW:") === "090811") document.getElementById('adminPanel').style.display="block"; }
    function hideAdmin() { document.getElementById('adminPanel').style.display="none"; }
    function pushUpdate() {
        const v = document.getElementById('up_ver').value, t = document.getElementById('up_title').value, d = document.getElementById('up_desc').value;
        db.ref('app_updates').push({ v, t, d, date: new Date().toLocaleDateString() }).then(() => { alert("완료"); hideAdmin(); });
    }
    function syncUpdates() {
        db.ref('app_updates').on('value', s => {
            let h = ""; const data = []; s.forEach(c => data.push(c.val()));
            data.reverse().forEach(u => h += `<div class="card up-card"><span class="up-ver">${u.v}</span><span style="float:right; font-size:0.75rem; color:#64748b;">${u.date}</span><div style="font-weight:800; margin:10px 0; font-size:1.05rem;">${u.t}</div><div style="font-size:0.9rem; color:#475569; line-height:1.6; white-space:pre-wrap;">${u.d}</div></div>`);
            document.getElementById('updateContainer').innerHTML = h || "공지사항이 없습니다.";
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        initTT(); toggleGradeOptions();
        // 달력 설정 핵심: contentHeight: 'auto'
        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), { 
            initialView: 'dayGridMonth', 
            locale: 'ko', 
            contentHeight: 'auto', 
            handleWindowResize: true,
            headerToolbar: { left: 'prev', center: 'title', right: 'next today' },
            events: JSON.parse(localStorage.getItem('DSHS_EVS')||'[]') 
        });
        renderTodo();
        syncUpdates();
    });

    document.getElementById('todoIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') addTodo(); });
</script>
</body>
</html>
